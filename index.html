<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuinteroFlix</title>
    <style>
        :root {
            --primary-red: #e50914;
            --bg-black: #080808;
            --card-bg: #141414;
            --poster-width: 180px;
            --poster-height: 270px;
            --expanded-width: 320px;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            overflow-x: hidden;
        }

        h1 {
            color: var(--primary-red);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        h2 { font-size: 1.2rem; color: #e5e5e5; margin-bottom: 20px; }

        .movie-row { 
            display: flex; 
            gap: 15px; 
            padding: 20px 0; 
            align-items: center; 
            flex-wrap: wrap; /* Para que si añades muchas, bajen de fila */
        }

        /* Tarjeta de Película */
        .movie-item {
            position: relative;
            width: var(--poster-width);
            height: var(--poster-height);
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 1;
            border: 1px solid #333;
        }

        .movie-item:hover {
            width: var(--expanded-width);
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            transform: scale(1.05);
            border-color: var(--primary-red);
        }

        .movie-img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .brand-logo {
            position: absolute;
            top: 8px;
            left: 8px;
            color: var(--primary-red);
            font-weight: 900;
            font-size: 22px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            font-family: 'Arial Black', sans-serif;
        }

        .info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            opacity: 0;
            transition: opacity 0.3s;
            box-sizing: border-box;
        }

        .movie-item:hover .info-overlay { opacity: 1; }
        .title { font-weight: bold; margin: 0; font-size: 1rem; }
        .meta { font-size: 0.7rem; color: #46d369; margin-top: 5px; }

        /* --- ESTILOS DEL POPUP (MODAL) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #181818;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            width: 320px;
            border: 1px solid #333;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #333;
            border: 2px solid transparent;
            border-radius: 4px;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 5px;
            box-sizing: border-box;
        }

        .modal-content input:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        .btn-confirm {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        .btn-cancel {
            background: transparent;
            color: #888;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            text-decoration: underline;
        }

        #error-msg {
            color: var(--primary-red);
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>QUINTEROFLIX</h1>
    <h2>Mi Lista</h2>

    <div class="movie-row">
        
        <a href="piratas.html" class="movie-item" style="text-decoration: none; color: white;">
            <div class="brand-logo">Q</div>
            <div class="movie-img" style="background-image: url('images/piratasbanner.jpg');"></div>
            <div class="info-overlay">
                <p class="title">Piratas del Caribe</p>
                <div class="meta">Aventuras • Piratas</div>
            </div>
        </a>

        <div class="movie-item" onclick="openModal('0007', 'jamesbond.html')">
            <div class="brand-logo">Q</div>
            <div class="movie-img" style="background-image: url('images/jamesbondbanner.jpg');"></div>
            <div class="info-overlay">
                <p class="title">James Bond: 007</p>
                <div class="meta">🔒 PIN REQUERIDO</div>
            </div>
        </div>

        <div class="movie-item" onclick="openModal('1234', 'varios.html')">
            <div class="brand-logo">Q</div>
            <div class="movie-img" style="background-image: url('images/variosbanner.jpg');"></div>
            <div class="info-overlay">
                <p class="title">Películas Variadas</p>
                <div class="meta">🔒 PIN REQUERIDO</div>
            </div>
        </div>

    </div>

    <div id="passwordModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Control Parental</h3>
            <p style="font-size: 0.9rem; color: #ccc;">Introduce el código PIN para acceder.</p>
            
            <input type="password" id="passInput" placeholder="****" maxlength="4">
            
            <div id="error-msg">PIN incorrecto. Inténtalo de nuevo.</div>
            
            <button class="btn-confirm" onclick="checkPassword()">ENTRAR</button>
            <button class="btn-cancel" onclick="closeModal()">CANCELAR</button>
        </div>
    </div>

    <script>
        let currentCorrectPin = "";
        let targetUrl = "";

        const modal = document.getElementById('passwordModal');
        const input = document.getElementById('passInput');
        const errorMsg = document.getElementById('error-msg');

        function openModal(pin, url) {
            currentCorrectPin = pin;
            targetUrl = url;
            modal.style.display = 'flex';
            input.focus();
        }

        function closeModal() {
            modal.style.display = 'none';
            input.value = '';
            errorMsg.style.display = 'none';
        }

        function checkPassword() {
            if (input.value === currentCorrectPin) {
                window.location.href = targetUrl;
            } else {
                errorMsg.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }

        // Detectar tecla Enter
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
